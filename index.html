<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0e11">
<title>Rangkai — Editor Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@400;700&family=Montserrat:wght@800&family=Oswald:wght@600&family=Pacifico&family=Playfair+Display:wght@700&family=Poppins:wght@400;700&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0d0e11; --surface:#17191e; --surface-2:#21242b; --surface-3:#2c3039;
  --line:#2f333c; --text:#f1f2f4; --text-dim:#9aa0ab; --text-faint:#646a76;
  --accent:#19d3c5; --accent-ink:#04201e; --danger:#ff5d6c; --warn:#ffc857;
  --clip-video:#33507a; --clip-image:#5a4a86; --clip-text:#a2572f; --clip-audio:#1f6f5c; --clip-fx:#7a3f6b; --clip-ink:#ffffff;
  --lane:#14161a; --handle:#ffffff; --handle-ink:#17191e; --scrim:rgba(5,6,8,.72);
  --r-s:6px; --r-m:10px; --r-l:16px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --tap:44px; --bar-h:48px; --tool-h:68px; --tl-h:clamp(196px,31vh,320px);
  --fs-xs:11px; --fs-s:13px; --fs-m:15px; --fs-l:18px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.22s;
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs-m)/1.35 var(--font);overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:0;box-shadow:var(--focus)}
button:disabled{opacity:.35;cursor:default}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor;stroke:none}
[hidden]{display:none!important}

/* ============ LAYOUT ============ */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.topbar{height:var(--bar-h);flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3)}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:var(--sp-2)}
.brand i{width:10px;height:10px;border-radius:var(--r-pill);background:var(--accent);display:block}
.save-state{font-size:var(--fs-xs);color:var(--text-faint);margin-left:var(--sp-1)}
.grow{flex:1}
.btn{min-height:36px;padding:0 var(--sp-3);border-radius:var(--r-pill);background:var(--surface-2);font-size:var(--fs-s);display:inline-flex;align-items:center;gap:var(--sp-2);white-space:nowrap;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.big{min-height:var(--tap);padding:0 var(--sp-5);font-size:var(--fs-m)}
.iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:var(--r-pill);color:var(--text)}
.iconbtn:active{background:var(--surface-2)}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:var(--sp-2)}
.canvas-wrap{position:relative;touch-action:none;overflow:hidden;background:var(--lane);border-radius:var(--r-s)}
.canvas-wrap canvas{display:block;width:100%;height:100%}
#selbox{position:absolute;left:0;top:0;border:1.5px solid var(--accent);pointer-events:none;transform-origin:50% 50%;border-radius:2px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);text-align:center;padding:var(--sp-5);background:var(--bg)}
.empty h1{font-size:var(--fs-l);margin:0}
.empty p{margin:0;color:var(--text-dim);font-size:var(--fs-s);max-width:34ch}

.bottom{flex:none;position:relative;background:var(--surface)}
.transport{height:var(--tap);display:flex;align-items:center;padding:0 var(--sp-2);gap:var(--sp-1)}
.transport .time{font-variant-numeric:tabular-nums;font-size:var(--fs-s);color:var(--text-dim);min-width:104px;white-space:nowrap}
.transport .time b{color:var(--text);font-weight:600}
.transport .iconbtn{width:40px}
.iconbtn.on{color:var(--accent)}
.spark{height:44px;background:var(--surface-2);border-radius:var(--r-m);padding:var(--sp-1)}
.spark svg{width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.transport .play{background:var(--text);color:var(--bg);width:38px;height:38px}
.timeline{height:var(--tl-h);position:relative;background:var(--bg);touch-action:none;overflow:hidden}
.timeline canvas{display:block;width:100%;height:100%;touch-action:none}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--text);pointer-events:none;border-radius:1px}
.playhead::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:8px;background:var(--text);border-radius:0 0 var(--r-s) var(--r-s)}
.toolbar{height:var(--tool-h);display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding:0 var(--sp-1);border-top:1px solid var(--line)}
.toolbar::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:64px;padding:0 var(--sp-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);font-size:var(--fs-xs);color:var(--text-dim);border-radius:var(--r-m)}
.tool svg{color:var(--text)}
.tool:active{background:var(--surface-2)}
.tool.danger svg,.tool.danger{color:var(--danger)}
.tool.back{min-width:44px;border-right:1px solid var(--line);border-radius:0;margin-right:var(--sp-1)}

/* ============ SHEET ============ */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:100%;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform var(--dur) var(--ease);display:flex;flex-direction:column;z-index:5;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-h{display:flex;align-items:center;padding:var(--sp-1) var(--sp-1) 0 var(--sp-4);flex:none}
.sheet-h h2{font-size:var(--fs-m);margin:0;flex:1;font-weight:600}
.sheet-b>*{flex:none}
.sheet-b{padding:var(--sp-2) var(--sp-4) var(--sp-4);overflow-y:auto;display:flex;flex-direction:column;gap:var(--sp-3);user-select:text;-webkit-user-select:text}
.field{display:grid;grid-template-columns:84px 1fr 56px;align-items:center;gap:var(--sp-3);font-size:var(--fs-s)}
.field-l{color:var(--text-dim)}
.field output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--tap);background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--surface-3);border-radius:var(--r-pill)}
input[type=range]::-moz-range-track{height:4px;background:var(--surface-3);border-radius:var(--r-pill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:var(--r-pill);background:var(--text);border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:var(--r-pill);background:var(--text);border:0}
.chips{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--sp-4)*-1);padding:0 var(--sp-4)}
.chip{min-height:38px;padding:0 var(--sp-3);border-radius:var(--r-m);background:var(--surface-2);font-size:var(--fs-s);flex:none;border:1.5px solid transparent}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.swatch{width:34px;height:34px;border-radius:var(--r-pill);border:2px solid var(--line);flex:none}
.swatch[aria-pressed=true]{border-color:var(--accent)}
input[type=color]{width:38px;height:38px;border:0;padding:0;background:none;flex:none}
textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--sp-3);resize:none;min-height:64px}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.hint{font-size:var(--fs-xs);color:var(--text-faint);margin:0}
.group-l{font-size:var(--fs-xs);color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin:0}

/* ============ MODAL / TOAST ============ */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:end center;z-index:20}
.modal-c{width:min(100%,460px);max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
@media(min-width:700px){.modal{place-items:center}.modal-c{border-radius:var(--r-l)}}
.modal-c h2{margin:0;font-size:var(--fs-l)}
.progress{height:8px;background:var(--surface-3);border-radius:var(--r-pill);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:var(--r-pill)}
.result-video{width:100%;max-height:46dvh;background:var(--bg);border-radius:var(--r-m)}
.kv{display:flex;justify-content:space-between;font-size:var(--fs-s);color:var(--text-dim)}
.kv b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:calc(var(--bar-h) + var(--sp-3));transform:translateX(-50%);background:var(--surface-3);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);font-size:var(--fs-s);z-index:30;pointer-events:none;opacity:0;transition:opacity var(--dur);max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media(min-width:900px){:root{--tool-h:72px}.tool{min-width:76px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><i></i><span id="brandName"></span></div>
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <div class="grow"></div>
    <button class="btn" id="btnNew" title="Proyek baru">Baru</button>
    <button class="btn" id="btnRatio" aria-label="Rasio kanvas">9:16</button>
    <button class="btn primary" id="btnExport">Ekspor</button>
  </header>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="gl" aria-label="Pratinjau video"></canvas>
      <div id="selbox" hidden></div>
    </div>
    <div class="empty" id="empty">
      <h1>Mulai dari klip pertamamu</h1>
      <p>Pilih video, foto, atau musik dari perangkat. Semua diproses di browser ini, tidak ada yang diunggah.</p>
      <button class="btn primary big" id="btnImportBig">Pilih media</button>
      <button class="btn" id="btnSample">Coba dengan contoh</button>
    </div>
  </main>

  <div class="bottom" id="bottom">
    <div class="transport">
      <button class="iconbtn" id="btnUndo" aria-label="Urungkan"></button>
      <button class="iconbtn" id="btnRedo" aria-label="Ulangi"></button>
      <div class="grow"></div>
      <span class="time" id="timeLabel"><b>00:00.0</b> / 00:00.0</span>
      <button class="iconbtn play" id="btnPlay" aria-label="Putar"></button>
      <button class="iconbtn" id="btnKf" aria-label="Tambah atau hapus keyframe di garis putar" aria-pressed="false" hidden></button>
      <div class="grow"></div>
      <button class="iconbtn" id="btnZoomOut" aria-label="Perkecil timeline"></button>
      <button class="iconbtn" id="btnZoomIn" aria-label="Perbesar timeline"></button>
    </div>
    <div class="timeline" id="tlWrap">
      <canvas id="tl" tabindex="0" role="application" aria-label="Timeline. Spasi putar, panah geser, S pisah, Delete hapus."></canvas>
      <div class="playhead"></div>
    </div>
    <nav class="toolbar" id="toolbar" aria-label="Alat"></nav>
    <section class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Tutup panel"></button></div>
      <div class="sheet-b" id="sheetBody"></div>
    </section>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="modal-c" id="modalC" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="file" multiple hidden>

<script>
'use strict';
/* =====================================================================
   Rangkai — editor video satu file. Tahap 2.
   Bagian: util · state · riwayat · penyimpanan · media · pemutar ·
           WebGL · timeline · pratinjau · alat & panel · ekspor · boot
   ===================================================================== */
const APP_NAME = 'Rangkai';            // ganti nama aplikasi di sini
const MUXER_URL = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js';

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const even = n => Math.max(2, Math.round(n / 2) * 2);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c);
  return el;
}
const ICONS = {
  plus: 'M12 5v14M5 12h14', minus: 'M5 12h14', pause: 'M8 5v14M16 5v14',
  undo: 'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3', redo: 'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',
  split: 'M12 3v18M5 8l3 4-3 4M19 8l-3 4 3 4', trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
  copy: 'M8 8h12v12H8zM4 16V4h12', text: 'M5 7V4h14v3M12 4v16M9 20h6',
  music: 'M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z',
  speed: 'M12 14l4-5M4 17a8 8 0 1116 0', volume: 'M4 9v6h4l5 4V5L8 9H4zM16.5 9a4 4 0 010 6',
  move: 'M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3',
  layers: 'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5', image: 'M4 4h16v16H4zM4 15l5-5 4 4 3-3 4 4',
  back: 'M15 5l-7 7 7 7', close: 'M6 6l12 12M18 6L6 18', edit: 'M4 20h4L19 9l-4-4L4 16v4z',
  film: 'M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4',
  filter: 'M4 10a5 5 0 1010 0a5 5 0 10-10 0M10 14a5 5 0 1010 0a5 5 0 10-10 0',
  adjust: 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',
  crop: 'M7 3v14h14M3 7h14v14', kf: 'M12 3l7 9-7 9-7-9z', freeze: 'M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9',
  reverse: 'M11 6l-6 6 6 6M19 6l-6 6 6 6', fx: 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
};
function ic(name) {
  if (name === 'play') return '<svg class="ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
  return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fmtTime(t) { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); }
function fmtClock(t) { t = Math.max(0, Math.round(t)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- state ---------- */
const RATIOS = { '9:16': [9, 16], '16:9': [16, 9], '1:1': [1, 1], '4:5': [4, 5], '3:4': [3, 4], '21:9': [21, 9] };
const FONTS = ['Inter', 'Poppins', 'Montserrat', 'Oswald', 'Bebas Neue', 'Playfair Display', 'Pacifico', 'Caveat'];
const PALETTE = ['#ffffff', '#000000', '#ffd23f', '#ff5d6c', '#19d3c5', '#4d8dff', '#b98cff', '#7bd66a', '#ff9f43'];
const TYPE_ORDER = ['fx', 'text', 'overlay', 'main', 'audio'];   // urutan baris di timeline (atas ke bawah)
const ROW_H = { fx: 26, text: 30, overlay: 44, main: 58, audio: 38 };
const RULER_H = 24, ROW_GAP = 5, MIN_DUR = 0.1, PEAK_RATE = 50;

function newProject() {
  return { v: 1, ratio: '9:16', bg: '#000000', tracks: [{ id: 'main', type: 'main', clips: [] }] };
}
const S = { project: newProject(), media: new Map(), time: 0, playing: false, sel: null, pps: 70, scrollY: 0, exporting: null, exportSize: null, sheetFor: undefined };
const P = () => S.project;
const mainTrack = () => P().tracks.find(t => t.type === 'main');
let LG = { W: 1080, H: 1920 };
function updateLogical() { const [a, b] = RATIOS[P().ratio]; const s = 1080 / Math.min(a, b); LG = { W: Math.round(a * s), H: Math.round(b * s) }; }
function duration() { let d = 0; for (const t of P().tracks) for (const c of t.clips) d = Math.max(d, c.start + c.dur); return d; }
function findClip(id) { if (!id) return null; for (const track of P().tracks) { const clip = track.clips.find(c => c.id === id); if (clip) return { clip, track }; } return null; }
const selClip = () => findClip(S.sel)?.clip || null;
const isVisual = c => c.type === 'video' || c.type === 'image' || c.type === 'text';
const hasMediaTime = c => c.type === 'video' || c.type === 'audio';
const mediaOf = c => S.media.get(c.mediaId);

/* easing, keyframe, kurva kecepatan */
const EASE = {
  linear: u => u, in: u => u * u * u, out: u => 1 - Math.pow(1 - u, 3), inout: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  back: u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  bounce: u => { const n = 7.5625, d = 2.75; if (u < 1 / d) return n * u * u; if (u < 2 / d) return n * (u -= 1.5 / d) * u + .75; if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + .9375; return n * (u -= 2.625 / d) * u + .984375; },
};
const EASE_NAMES = [['linear', 'Linear'], ['in', 'Mulai pelan'], ['out', 'Akhir pelan'], ['inout', 'Halus'], ['back', 'Kenyal'], ['bounce', 'Memantul']];
const KF_PROPS = ['x', 'y', 'scale', 'rot', 'opacity', 'volume'];
let RT = 0;                                   // waktu render terakhir; dipakai gv() bila waktu tidak diberikan
function gv(c, p, t) {                        // nilai properti (dengan keyframe bila ada)
  const ks = c.kfs; if (!ks || !ks.length) return c[p];
  const lt = (t === undefined ? RT : t) - c.start;
  if (lt <= ks[0].t) return ks[0][p];
  const last = ks[ks.length - 1]; if (lt >= last.t) return last[p];
  let i = 0; while (ks[i + 1].t <= lt) i++;
  const a = ks[i], b = ks[i + 1], u = (lt - a.t) / (b.t - a.t);
  return a[p] + (b[p] - a[p]) * (EASE[a.e] || EASE.linear)(u);
}
const kfAt = (c, lt) => (c.kfs || []).find(k => Math.abs(k.t - lt) < 0.04);
function addKf(c, lt) { const k = { t: lt, e: 'linear' }; for (const p of KF_PROPS) k[p] = gv(c, p, c.start + lt); c.kfs = (c.kfs || []).concat(k).sort((a, b) => a.t - b.t); return k; }

async function exportOffline(opt, onProg, signal) {

  try { mixed = await mixAudio(dur); } catch (e) { console.warn('mix audio gagal', e); }

    }
    await venc.flush(); if (err) throw err;

async function exportRealtime(opt, onProg, signal) {

  try {
    await sleep(350); rec.start(500); play(); const dur = duration();
    await new Promise((res, rej) => { const iv = setInterval(() => { onProg(S.time / dur, 'Merekam secara langsung, biarkan tab ini terbuka…'); if (signal.aborted) { clearInterval(iv); rej(new DOMException('batal', 'AbortError')); } else if (!S.playing) { clearInterval(iv); res(); } }, 120); });
    await sleep(200); const stopped = new Promise(r => rec.onstop = r); rec.stop(); await stopped;

addEventListener('keydown', e => {

    const saved = await DB.get('kv', 'project'); if (!saved) return;
    const proj = JSON.parse(saved); if (!proj || !proj.tracks || !proj.tracks.some(t => t.type === 'main')) return;
    const used = new Set(); proj.tracks.forEach(t => t.clips.forEach(c => c.mediaId && used.add(c.mediaId))); if (proj.bgImage) used.add(proj.bgImage);

    }
    proj.tracks.forEach(t => t.clips = t.clips.filter(c => !c.mediaId || S.media.has(c.mediaId)));
